<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TOPCon AI — Process Optimization Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#03080F;font-family:'Exo 2',sans-serif;}
#root{height:100%;display:flex;flex-direction:column;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:#03080F;}
::-webkit-scrollbar-thumb{background:#152840;border-radius:2px;}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;outline:none;cursor:pointer;margin:0;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#00D4FF;border:2px solid #03080F;box-shadow:0 0 8px #00D4FF66;cursor:pointer;}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#00D4FF;border:none;cursor:pointer;}
textarea,input{color:#E2EEF8;}
textarea::placeholder,input::placeholder{color:#3D6080;}
button{outline:none;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 16px #00D4FF44}50%{box-shadow:0 0 28px #00D4FF88}}
.slide-up{animation:slideUp .3s ease both;}
.ai-response{animation:slideUp .35s ease both;}
.spin{animation:spin .8s linear infinite;}

/* ─── Bottom Tab Navigation ─────────────────────────────────────────────────── */
.tab-nav-container{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(to top,#03080F 60%,#03080F00);
  backdrop-filter:blur(8px);
  border-top:2px solid #152840;
  padding:0;
  margin:0;
  z-index:1000;
  box-shadow:0 -4px 20px rgba(0,0,0,0.6);
}

.tab-nav{
  display:flex;
  gap:4px;
  padding:8px 6px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.tab-nav::-webkit-scrollbar{
  display:none;
}

.tab-btn{
  flex:0 0 auto;
  min-width:max-content;
  height:48px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:2px solid transparent;
  border-radius:8px;
  background:#0B1E30;
  color:#A0B8D8;
  font-family:'Rajdhani',sans-serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.5px;
  cursor:pointer;
  transition:all 0.25s ease;
  white-space:nowrap;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

.tab-btn:hover{
  background:#152840;
  color:#D4E8FF;
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(0,212,255,0.15);
}

.tab-btn.active{
  background:linear-gradient(135deg,#00D4FF22,#006880cc);
  border-color:#00D4FF;
  color:#00D4FF;
  box-shadow:0 0 16px #00D4FF44,inset 0 0 8px #00D4FF11;
  font-weight:700;
}

.tab-btn.active:hover{
  box-shadow:0 0 24px #00D4FF66,inset 0 0 12px #00D4FF22;
  transform:translateY(-2px);
}

.tab-icon{
  font-size:16px;
  display:inline-block;
  line-height:1;
}

.tab-label{
  display:inline-block;
}

/* Responsive adjustments for mobile */
@media(max-width:640px){
  .tab-nav{
    padding:6px 4px;
    gap:3px;
  }
  
  .tab-btn{
    min-width:56px;
    height:56px;
    padding:0 12px;
    font-size:11px;
    gap:6px;
  }
  
  .tab-btn .tab-label{
    display:none;
  }
  
  .tab-icon{
    font-size:20px;
  }
}

@media(max-width:480px){
  .tab-btn{
    min-width:52px;
    height:52px;
    padding:0 8px;
  }
}

/* Main content scrollable area */
.main-content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:72px;
}

.main-content::-webkit-scrollbar{
  width:4px;
}

.main-content::-webkit-scrollbar-track{
  background:#03080F;
}

.main-content::-webkit-scrollbar-thumb{
  background:#152840;
  border-radius:2px;
}

.main-content::-webkit-scrollbar-thumb:hover{
  background:#1a3555;
}
</style>

// ─── Anthropic API call with error handling ───────────────────────────────
// IMPORTANT: To use real AI, set your API key here or use environment variable
// For demo, it will return simulated responses
const ANTHROPIC_API_KEY = ''; // PASTE YOUR API KEY HERE OR LEAVE EMPTY FOR DEMO MODE

async function callClaude(systemPrompt, userMsg, maxTokens = 900) {
  // DEMO MODE: Return simulated responses when no API key
  if (!ANTHROPIC_API_KEY) {
    console.log('DEMO MODE: No API key provided. Using simulated response.');
    await new Promise(r => setTimeout(r, 800)); // Simulate network delay
    
    // Generate intelligent simulated response based on context
    if (systemPrompt.includes('TOPCon solar cell process engineer')) {
      return `🔬 PROCESS OPTIMIZATION ANALYSIS (SIMULATED)

1. DIAGNOSIS: Current recipe shows moderate deviation from optimal parameters. The Boron diffusion step has BCl₃ flow at 200sccm (optimal), but temperature variation suggests non-uniformity risk.

2. TOP 3 OPTIMIZATIONS:
   • BORON DIFFUSION: BCl₃ Flow 200→185 sccm → +0.12% Eta gain
   • PECVD SiNₓ: SiH₄:NH₃ ratio 1:3→1:2.8 → +0.08% Eta gain
   • Co-Firing: Peak Temp 795→805°C → +0.15% Eta gain (with belt speed adjustment)

3. CAUTIONS: Monitor Rs during BCl₃ reduction; check ALD film thickness after changes.

4. PREDICTED OUTCOME: Eta 24.65→24.92% (±0.08%)`;
    }
    
    if (systemPrompt.includes('yield analysis expert')) {
      return `📊 YIELD ANALYSIS (SIMULATED)

1. YIELD LOSS ROOT CAUSES:
   • Critical alerts in PECVD (plasma damage) reducing FF by 1.2%
   • Boron diffusion uniformity affecting Voc distribution
   • Co-firing thermal budget deviation causing Rsh variation

2. BINS TO IMPROVE:
   • Focus on 24.0–24.5% bin (currently 35%) → target 25%
   • Reduce <23.5% scrap from 15% to <8%

3. TOP 2 RECIPE CHANGES:
   • Reduce RF power from 220W to 195W in PECVD
   • Adjust peak temp to 800°C with belt speed 5.5 m/min

4. EXPECTED YIELD AFTER FIX: 96.8% (+2.1%)`;
    }
    
    if (systemPrompt.includes('Design of Experiments')) {
      return `🧪 DOE INSIGHT (SIMULATED)

1. OPTIMAL OPERATING WINDOW: ${userMsg.includes('BCl₃') ? 'BCl₃' : 'Parameter'} between 175-210 units shows maximum Eta response.

2. RESPONSE CURVE SHAPE: Quadratic with clear optimum; sensitivity increases beyond ±15% from center point.

3. INTERACTION RISKS: Strong interaction with temperature; 2-factor interaction coefficient ~0.08.

4. RECOMMENDED SETPOINT: ${userMsg.includes('BCl₃') ? 'BCl₃ = 192 sccm' : 'Optimal at +8% from baseline'} with tolerance ±3% for robust performance.`;
    }
    
    if (systemPrompt.includes('compare multiple recipe scenarios')) {
      return `⚖️ SCENARIO COMPARISON (SIMULATED)

1. BEST SCENARIO: Scenario 1 (Optimal Recipe) with Eta 24.78%

2. KEY DIFFERENCES: Lower BCl₃ flow reduces recombination; optimized PECVD improves ARC.

3. RISKS OF EACH: Scenario 2 may have higher contact resistance; Scenario 3 requires tighter temp control.

4. RECOMMENDED HYBRID: Use Scenario 1's Boron diffusion + Scenario 2's PECVD + Scenario 3's firing profile → estimated 24.85% Eta.`;
    }
    
    if (systemPrompt.includes('failure analyst')) {
      return `🔍 ROOT CAUSE ANALYSIS (SIMULATED)

1. ROOT CAUSE: PECVD plasma damage from RF power exceeding 240W, causing surface recombination increase.

2. SECONDARY CAUSES:
   • ALD Al₂O₃ purge time insufficient (100ms vs required 120ms)
   • Co-firing over-fire condition (thermal budget +8%)

3. EVIDENCE: RF power at 265W correlates with Voc drop of 12mV; EL imaging would show uniform darkening.

4. CORRECTIVE ACTION: Reduce RF power to 210W, increase purge time to 130ms, adjust peak temp to 790°C.

5. VERIFICATION: Measure Voc recovery to >718mV; EL contrast improvement >15%.`;
    }
    
    return `AI Analysis complete. Current configuration shows ${userMsg.includes('Eta') ? 'efficiency' : 'process'} at optimal range. Consider fine-tuning Boron diffusion temperature for additional gains.`;
  }
  
  // REAL API CALL with proper headers
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": ANTHROPIC_API_KEY,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({
        model: "claude-3-sonnet-20240229",
        max_tokens: maxTokens,
        system: systemPrompt,
        messages: [{
          role: "user",
          content: userMsg
        }]
      })
    });
    
    if (!res.ok) {
      const errorText = await res.text();
      console.error('API Error:', res.status, errorText);
      throw new Error(`API returned ${res.status}: ${errorText.substring(0, 100)}`);
    }
    
    const data = await res.json();
    return data.content?.map(b => b.text).join("") ?? "No response content.";
  } catch (e) {
    console.error('Claude API call failed:', e);
    return `⚠️ API Error: ${e.message}. ${!ANTHROPIC_API_KEY ? 'Please set ANTHROPIC_API_KEY at the top of the file.' : 'Check your API key and network connection.'}`;
  }
}

// ─── Palette ───────────────────────────────────────────────────────────────
const C = {
  bg: "#03080F",
  surf: "#081524",
  panel: "#0B1E30",

// ─── Process physics engine ──────────────────────────────────────────────────────
const BASELINE = {
  Voc: 720,
  Jsc: 39.5,
  FF: 83.2,
  Rs: 2.2,
  Rsh: 600,
  Eta: 24.5
};
const STEPS = [{
  key: "tex",
  label: "Texturing",
  short: "TEX",
  color: "#00D4FF",
  icon: "◈",
  params: [{
    key: "koh",
    label: "KOH Conc.",
    unit: "%",
    min: 0.5,
    max: 4.0,
    step: 0.1,
    def: 1.5,
    target: 1.5,
    tol: 0.3
  }, {
    key: "temp",
    label: "Bath Temp",
    unit: "°C",
    min: 70,
    max: 95,
    step: 1,
    def: 80,
    target: 80,
    tol: 3
  }, {
    key: "time",
    label: "Etch Time",
    unit: "min",
    min: 10,
    max: 60,
    step: 1,
    def: 30,
    target: 30,
    tol: 5
  }, {
    key: "add",
    label: "Additive",
    unit: "ml/L",
    min: 1,
    max: 15,
    step: 0.5,
    def: 5,
    target: 5,
    tol: 1
  }],
  propagate(v) {
    const al = [], lk = {};
    const kd = v.koh - 1.5, td = v.temp - 80;
    if (Math.abs(kd) > 0.05) {
      lk.time = { rec: +(30 - kd / 0.1 * 0.6).toFixed(1), reason: "−0.6 min per +0.1% KOH" };
      lk.add = { rec: +(5 + kd / 0.1 * 0.6).toFixed(1), reason: "+0.6 ml/L per +0.1% KOH (1:3)" };
      if (Math.abs(kd) > 0.3) al.push({ lvl: "C", msg: `KOH ${kd > 0 ? "↑" : "↓"}${Math.abs(kd).toFixed(1)}% → Time MUST ${kd > 0 ? "↓" : "↑"}${(Math.abs(kd) / 0.1 * 0.6).toFixed(1)} min | Additive MUST ${kd > 0 ? "↑" : "↓"}${(Math.abs(kd) / 0.1 * 0.6).toFixed(1)} ml/L` });
    }
    if (Math.abs(td) > 1) {
      lk.time = { rec: +((lk.time?.rec ?? 30) - td * 1.2).toFixed(1), reason: "Arrhenius: −1.2 min/°C" };
      if (Math.abs(td) > 3) al.push({ lvl: "C", msg: `Temp ${td > 0 ? "↑" : "↓"}${Math.abs(td)}°C → Time MUST ${td > 0 ? "↓" : "↑"}${(Math.abs(td) * 1.2).toFixed(1)} min` });
    }
    return { linked: lk, alerts: al };
  },
  elec(v) {
    const oe = Math.max(0, (v.koh - 1.5) * 2 + (v.temp - 80) * 0.3 + (v.time - 30) * 0.15 - 0.5);
    return { Voc: { d: -oe * 4 }, Jsc: { d: -oe * 0.4 }, FF: { d: -oe * 0.2 }, Rs: { d: +oe * 0.05 }, Rsh: { d: 0 }, Eta: { d: -oe * 0.5 } };
  }
}, {
  key: "bor",
  label: "Boron Diff.",
  short: "BOR",
  color: "#10B981",
  icon: "⬡",
  params: [{
    key: "bcl3",
    label: "BCl₃ Flow",
    unit: "sccm",
    min: 50,
    max: 500,
    step: 5,
    def: 200,
    target: 200,
    tol: 20
  }, {
    key: "o2",
    label: "O₂ Flow",
    unit: "sccm",
    min: 200,
    max: 2000,
    step: 20,
    def: 800,
    target: 800,
    tol: 80
  }, {
    key: "ft",
    label: "Furnace T",
    unit: "°C",
    min: 820,
    max: 950,
    step: 1,
    def: 880,
    target: 880,
    tol: 5
  }, {
    key: "fd",
    label: "Diff. Time",
    unit: "min",
    min: 10,
    max: 60,
    step: 1,
    def: 25,
    target: 25,
    tol: 3
  }],
  propagate(v) {
    const al = [], lk = {};
    const bd = v.bcl3 - 200, td = v.ft - 880;
    if (Math.abs(bd) > 5) {
      lk.o2 = { rec: +(800 + bd * 4).toFixed(0), reason: "O₂:BCl₃=4:1 (stoichiometry)" };
      lk.fd = { rec: +Math.max(5, 25 - bd / 200 * 25).toFixed(1), reason: "Dose=Flow×Time=const" };
      al.push({ lvl: "C", msg: `BCl₃ ${bd > 0 ? "↑" : "↓"}${Math.abs(bd).toFixed(0)}sccm → O₂ MUST ${bd > 0 ? "↑" : "↓"}${Math.abs(bd * 4).toFixed(0)}sccm | Time MUST ${bd > 0 ? "↓" : "↑"}${Math.abs(bd / 200 * 25).toFixed(1)}min` });
    }
    if (Math.abs(td) > 2) {
      const rf = Math.exp(td * 0.026);
      lk.fd = { rec: +Math.max(5, (lk.fd?.rec ?? 25) / rf).toFixed(1), reason: `Ea=3.5eV; +10°C→D↑35%` };
      lk.bcl3 = { rec: +(v.bcl3 * (1 - td * 0.015)).toFixed(0), reason: "−15% flow per +10°C" };
      if (Math.abs(td) > 5) al.push({ lvl: "C", msg: `Temp ${td > 0 ? "↑" : "↓"}${Math.abs(td)}°C → Time MUST ${td > 0 ? "↓" : "↑"}${Math.abs(25 - (lk.fd?.rec ?? 25)).toFixed(1)}min | BCl₃ MUST ${td > 0 ? "↓" : "↑"}${Math.abs(v.bcl3 - (lk.bcl3?.rec ?? 200)).toFixed(0)}sccm` });
    }
    return { linked: lk, alerts: al };
  },
  elec(v) {
    const n = 800 / (v.bcl3 / 200) / (v.fd / 25) / ((v.ft - 850) * 0.005 + 1) / 110;
    const ov = Math.max(0, 1 - n), un = Math.max(0, n - 1);
    return { Voc: { d: ov > 0 ? -ov * 18 : -un * 8 }, Jsc: { d: ov > 0 ? -ov * 0.15 : 0 }, FF: { d: un > 0 ? -un * 1.5 : 0 }, Rs: { d: un > 0 ? +un * 0.5 : 0 }, Rsh: { d: 0 }, Eta: { d: ov > 0 ? -ov * 1.2 : -un * 0.7 } };
  }
}, {
  key: "lpc",
  label: "LPCVD",
  short: "LPC",
  color: "#F59E0B",
  icon: "▣",
  params: [{
    key: "sih4",
    label: "SiH₄ Flow",
    unit: "sccm",
    min: 30,
    max: 300,
    step: 5,
    def: 100,
    target: 100,
    tol: 10
  }, {
    key: "pr",
    label: "Pressure",
    unit: "mTorr",
    min: 100,
    max: 500,
    step: 5,
    def: 200,
    target: 200,
    tol: 20
  }, {
    key: "lt",
    label: "Furnace T",
    unit: "°C",
    min: 550,
    max: 640,
    step: 1,
    def: 580,
    target: 580,
    tol: 5
  }, {
    key: "ld",
    label: "Depo Time",
    unit: "min",
    min: 10,
    max: 120,
    step: 1,
    def: 45,
    target: 45,
    tol: 5
  }],
  propagate(v) {
    const al = [], lk = {};
    const fd = v.sih4 - 100, td = v.lt - 580;
    if (Math.abs(fd) > 5) {
      lk.ld = { rec: +Math.max(10, 45 * (1 - fd / 100)).toFixed(1), reason: "Rate∝SiH₄; same thickness" };
      lk.lt = { rec: +(580 - fd * 0.3).toFixed(0), reason: "−3°C/+10sccm (nucleation)" };
      al.push({ lvl: "C", msg: `SiH₄ ${fd > 0 ? "↑" : "↓"}${Math.abs(fd)}sccm → Time MUST ${fd > 0 ? "↓" : "↑"}${Math.abs(45 - Math.max(10, 45 * (1 - fd / 100))).toFixed(1)}min | Temp MUST ${fd > 0 ? "↓" : "↑"}${Math.abs(fd * 0.3).toFixed(0)}°C` });
    }
    if (Math.abs(td) > 3) {
      const rf = Math.exp(td * 0.018);
      lk.ld = { rec: +Math.max(10, (lk.ld?.rec ?? 45) / rf).toFixed(1), reason: `Arrhenius Ea=1.6eV` };
      if (Math.abs(td) > 8) al.push({ lvl: "C", msg: `Temp ${td > 0 ? "↑" : "↓"}${Math.abs(td)}°C → Rate×${rf.toFixed(2)} → Time MUST ${td > 0 ? "↓" : "↑"}${Math.abs(45 - Math.max(10, lk.ld?.rec ?? 45)).toFixed(1)}min` });
    }
    return { linked: lk, alerts: al };
  },
  elec(v) {
    const thick = 3.9 * (v.sih4 / 100) * Math.exp((v.lt - 580) * 0.018) * v.ld;
    const td = thick - 175;
    return { Voc: { d: td < -30 ? -18 : td > 30 ? -5 : +2 }, Jsc: { d: td > 30 ? -0.1 : 0 }, FF: { d: 0 }, Rs: { d: td > 30 ? +0.1 : 0 }, Rsh: { d: td < -30 ? -800 : +300 }, Eta: { d: td < -30 ? -1.0 : td > 30 ? -0.3 : +0.1 } };
  }
}, {
  key: "ald",
  label: "ALD Al₂O₃",
  short: "ALD",
  color: "#A855F7",
  icon: "◎",
  params: [{
    key: "tma",

    unit: "ms",
    min: 5,
    max: 100,
    step: 1,
    def: 20,
    target: 20,
    tol: 3
  }, {
    key: "purge",
    label: "N₂ Purge",
    unit: "ms",
    min: 50,
    max: 500,
    step: 5,
    def: 100,
    target: 100,
    tol: 10
  }, {
    key: "h2o",
    label: "H₂O Pulse",
    unit: "ms",
    min: 5,
    max: 100,
    step: 1,
    def: 20,
    target: 20,
    tol: 3
  }, {
    key: "cyc",
    label: "Cycles",
    unit: "cyc",
    min: 40,
    max: 200,
    step: 5,
    def: 100,
    target: 100,
    tol: 10
  }],
  propagate(v) {
    const al = [], lk = {};
    const minP = Math.max(v.tma, v.h2o) * 5;
    lk.purge = { rec: +minP.toFixed(0), reason: `MUST ≥5×max(TMA,H₂O)=${minP}ms` };
    if (v.purge < minP - 10) al.push({ lvl: "C", msg: `CRITICAL: Purge ${v.purge}ms < required ${minP}ms → CVD growth → Voc −15 to −30mV!` });
    if (Math.abs(v.tma - 20) > 2) al.push({ lvl: "I", msg: `TMA ${v.tma}ms → Purge MUST be ≥${v.tma * 5}ms` });
    const thick = (v.cyc * 0.09).toFixed(1);
    lk._thick = thick;
    if (parseFloat(thick) < 7) al.push({ lvl: "C", msg: `Film ${thick}nm < 7nm → Qf −30% → Voc −10 to −20mV` });
    else if (parseFloat(thick) > 15) al.push({ lvl: "W", msg: `Film ${thick}nm > 15nm → contact barrier risk` });
    return { linked: lk, alerts: al };
  },
  elec(v) {
    const thick = v.cyc * 0.09;
    const cvd = v.purge < Math.max(v.tma, v.h2o) * 5 - 10;
    return { Voc: { d: cvd ? -22 : thick < 7 ? -17 : thick > 15 ? -5 : +2 }, Jsc: { d: 0 }, FF: { d: cvd ? -1.5 : thick > 15 ? -0.8 : 0 }, Rs: { d: thick > 15 ? +0.4 : 0 }, Rsh: { d: cvd ? -2000 : thick < 7 ? -800 : +500 }, Eta: { d: cvd ? -1.5 : thick < 7 ? -1.0 : thick > 15 ? -0.5 : +0.2 } };
  }
}, {
  key: "pec",
  label: "PECVD SiNₓ",
  short: "PEC",
