        al.push({ lvl: "W", msg: `Pressure ${pd>0?"↑":"↓"}${Math.abs(pd)} mBar → time should ${pd>0?"increase":"decrease"} by ${Math.abs(pd/200*7).toFixed(1)} min` });

      const deltaVoc = -Math.min(15, score * 3);
      const deltaFF = -Math.min(1.2, score * 0.2);
      return { Voc: { d: deltaVoc }, Jsc: { d: 0 }, FF: { d: deltaFF }, Rs: { d: score*0.03 }, Rsh: { d: -score*80 }, Eta: { d: deltaEta } };

      { key: "sih4", label: "SiH₄ Total", unit: "sccm", min: 800, max: 2000, step: 10, def: 1435, target: 1435, tol: 100 },
      { key: "lt", label: "Furnace T", unit: "°C", min: 590, max: 640, step: 1, def: 615, target: 615, tol: 3 },
      { key: "ld", label: "Depo Time", unit: "min", min: 20, max: 45, step: 0.5, def: 29.2, target: 29.2, tol: 2 },

    propagate(v) {
      let al = [], lk = {};

        al.push({ lvl: "W", msg: `Temperature shift → time ${td>0?"↓":"↑"} to ${lk.ld.rec} min` });

      let deltaEta = -Math.abs(ratio - 4.2) * 0.08 - Math.abs(rfNorm) * 0.15;
      deltaEta = Math.max(-0.9, deltaEta);
      return { Voc: { d: deltaEta * 40 }, Jsc: { d: deltaEta * 0.5 }, FF: { d: deltaEta * 1.2 }, Rs: { d: 0 }, Rsh: { d: 0 }, Eta: { d: deltaEta } };
    }
  },
  { key: "fir", label: "Co‑Firing", short: "FIR", color: "#F97316", icon: "🔥",
    params: [
      { key: "peak", label: "Peak Temp", unit: "°C", min: 750, max: 850, step: 1, def: 795, target: 795, tol: 4 },
      { key: "belt", label: "Belt Speed", unit: "m/min", min: 4.0, max: 7.5, step: 0.05, def: 5.7, target: 5.7, tol: 0.15 }

    propagate(v) {
      let al = [], lk = {};
      const br = (v.peak+273) / v.belt;
      const br_target = (795+273)/5.7;
      const budget = br / br_target;
      lk._budget = budget.toFixed(3);
      if (budget > 1.06) al.push({ lvl: "C", msg: `OVER‑FIRE: ${((budget-1)*100).toFixed(0)}% excess → Rsh collapse` });
      else if (budget < 0.94) al.push({ lvl: "W", msg: `UNDER‑FIRE: Rs rise expected` });
      return { linked: lk, alerts: al };
    },
    elec(v) {
      const br = ((v.peak+273)/v.belt) / ((795+273)/5.7);
      const ov = Math.max(0, br-1), un = Math.max(0, 1-br);
      let deltaEta = -ov*0.9 - un*0.6;
      deltaEta = Math.max(-1.2, deltaEta);
      return { Voc: { d: -ov*18 }, Jsc: { d: 0 }, FF: { d: -ov*3.5 - un*2.2 }, Rs: { d: un*0.8 }, Rsh: { d: -ov*2000 }, Eta: { d: deltaEta } };
    }
  }

// ----- helper functions -----
function initVals() {
  let v = {};
  STEPS.forEach(s => { v[s.key] = {}; s.params.forEach(p => { v[s.key][p.key] = p.def; }); });
  return v;
}
function getAllElec(vals) { return STEPS.map(s => s.elec(vals[s.key])); }
function getTotalEta(vals) { return BASELINE.Eta + getAllElec(vals).reduce((s,e) => s + (e.Eta?.d ?? 0), 0); }
function getStepFin(vals, stepKey) {
  const s = STEPS.find(x => x.key === stepKey);
  const e = s.elec(vals[stepKey]);
  return {
    Voc: BASELINE.Voc + (e.Voc?.d ?? 0),
    Jsc: BASELINE.Jsc + (e.Jsc?.d ?? 0),
    FF: BASELINE.FF + (e.FF?.d ?? 0),
    Rs: BASELINE.Rs + (e.Rs?.d ?? 0),
    Rsh: BASELINE.Rsh + (e.Rsh?.d ?? 0),
    Eta: BASELINE.Eta + (e.Eta?.d ?? 0)
  };
}
